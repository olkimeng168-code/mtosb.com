<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កែប្រែព័ត៌មានអ្នកប្រើប្រាស់ | EPS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Freehand&family=Hanuman:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Hanuman', serif; 
            background-color: #f8f9fa; 
        }
        .card { 
            border: none; 
            border-radius: 15px; 
        }
        /* កូដដែលត្រឹមត្រូវគឺបែបនេះ */
        .card-header { 
            border-radius: 15px 15px 0 0; 
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white p-3">
                    <h5 class="mb-0 text-center">📝 កែប្រែព័ត៌មានអ្នកប្រើប្រាស់៖ {{ user.full_name }}</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('edit_user', user_id=user.id) }}" method="POST">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">ឈ្មោះពេញ</label>
                                <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
                                <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">អ៊ីមែល (Email)</label>
                                <input type="email" name="email" class="form-control" value="{{ user.email if user.email else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">លេខទូរសព្ទ</label>
                                <input type="text" name="phone_number" class="form-control" value="{{ user.phone_number if user.phone_number else '' }}">
                            </div>
                        </div>

                        <div class="row border-top pt-3 mt-2">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-primary">តួនាទី (Role)</label>
                                <select name="role_id" class="form-select border-primary" required>
                                    {% for role in roles %}
                                        <option value="{{ role.role_id }}" {% if role.role_id == user.role_id %}selected{% endif %}>
                                            {{ role.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold text-danger">លេខសម្ងាត់ថ្មី (ទុកទទេបើមិនចង់ដូរ)</label>
                                <input type="password" name="password" class="form-control border-danger" placeholder="បញ្ចូលលេខសម្ងាត់ថ្មី...">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('manage_users') }}" class="btn btn-outline-secondary px-4">
                                ❌ បោះបង់
                            </a>
                            <button type="submit" class="btn btn-primary px-5 shadow">
                                ✅ រក្សាទុកការកែប្រែ
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-center text-muted mt-4 small">ចុះឈ្មោះដោយ៖ {{ full_name }}</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
