<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធមិនដំណើរការ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Battambang', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            margin: 0;
            padding: 15px;
        }
        .closed-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            border-top: 5px solid #d32f2f;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #feebee;
            color: #d32f2f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 20px auto;
        }
        .moul-font {
            font-family: 'Moul', cursive;
            color: #0b2e59;
            font-size: 1.5rem;
            margin-bottom: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="closed-card">
        <div class="icon-circle">
            <i class="fas fa-qrcode"></i>
            <i class="fas fa-ban position-absolute" style="font-size: 45px; opacity: 0.8;"></i>
        </div>

        <h2 class="moul-font">បិទការចូលប្រើប្រាស់</h2>
        <p class="text-danger fw-bold fs-5 mb-4">{{ message }}</p>

        {% if start_time or end_time %}
        <div class="bg-light p-3 rounded-3 mb-4 border">
            <p class="text-muted small mb-2 fw-bold">កាលវិភាគដែលអនុញ្ញាតឱ្យប្រើប្រាស់៖</p>
            
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-success small"><i class="fas fa-play-circle me-1"></i> ចាប់ផ្តើម៖</span>
                <span class="fw-bold text-dark small" style="font-family: Arial;">
                    {{ start_time.strftime('%d-%m-%Y %I:%M %p') if start_time else 'មិនកំណត់' }}
                </span>
            </div>
            
            <div class="d-flex justify-content-between align-items-center">
                <span class="text-danger small"><i class="fas fa-stop-circle me-1"></i> បញ្ចប់៖</span>
                <span class="fw-bold text-dark small" style="font-family: Arial;">
                    {{ end_time.strftime('%d-%m-%Y %I:%M %p') if end_time else 'មិនកំណត់' }}
                </span>
            </div>
        </div>
        {% endif %}
    </div>

</body>
</html>
