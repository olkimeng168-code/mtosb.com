<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រព័ន្ធ - EPS Smart Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Khmer OS Siemreap'; src: local('Khmer OS Siemreap'); }
        
        body { 
            font-family: 'Khmer OS Siemreap', sans-serif; 
            /* ផ្ទៃខាងក្រោយរលោងទាក់ទាញ */
            background: linear-gradient(135deg, #e0e8f5 0%, #cfd9e8 100%); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        /* Card ដ៏ស្រស់ស្អាត */
        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* ផ្នែកក្បាល Card ស៊ីគ្នានឹង Navbar របស់ Dashboard */
        .login-header {
            background-color: #2c3136; 
            border-bottom: 4px solid #ffc107; 
            padding: 2.5rem 1.5rem 2rem;
            text-align: center;
            color: white;
            position: relative;
        }

        .login-logo {
            width: 65px;
            height: 65px;
            background-color: #ffc107;
            color: #2c3136;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
        }

        /* ការរចនាប្រអប់ Input ជាមួយ Icon */
        .form-label {
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-right: none;
            color: #6c757d;
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        .form-control {
            padding: 0.75rem 1rem;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-left: none;
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #86b7fe;
            box-shadow: none;
        }
        
        /* ធ្វើឱ្យ Border ជុំវិញ Input ដិតពណ៌ពេលចុច */
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #86b7fe;
            background-color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
        }
        .input-group:focus-within .input-group-text {
            color: #0d6efd;
        }

        /* ប៊ូតុង Login */
        .btn-login {
            padding: 0.8rem;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.3);
        }

        /* Alert Messages */
        .alert {
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm border-0 border-start border-4 border-{{ category }}" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-fingerprint"></i>
                </div>
                <h4 class="fw-bold mb-0">EPS Smart Exam</h4>
                <p class="text-white-50 small mb-0 mt-1">ប្រព័ន្ធគ្រប់គ្រងការប្រឡងវៃឆ្លាត v2.0</p>
            </div>
            
            <div class="card-body p-4 p-sm-5">
                <h5 class="fw-bold text-center mb-4 text-dark">ចូលគណនី (Login)</h5>
                
                <form method="POST" action="/login">
                    <div class="mb-4">
                        <label class="form-label">ឈ្មោះគណនី (Username)</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" name="username" placeholder="បញ្ចូលឈ្មោះគណនី" required autocomplete="off">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">លេខសម្ងាត់ (Password)</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login w-100 mt-2">
                        <i class="fas fa-sign-in-alt me-2"></i> ចូលប្រព័ន្ធ
                    </button>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <p class="text-muted small">&copy; 2026 MTOSB. រក្សាសិទ្ធិគ្រប់យ៉ាង។</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
